<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="sealBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Gold Foil Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="75%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Ray Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <path id="topTextArc" d="M 85 250 A 165 165 0 0 1 415 250" fill="none" />
    <path id="bottomTextArc" d="M 415 250 A 165 165 0 0 1 85 250" fill="none" />
  </defs>

  <!-- Outer Ring with Gold Border -->
  <circle cx="250" cy="250" r="240" fill="url(#sealBg)" stroke="url(#goldGradient)" stroke-width="10" />
  <circle cx="250" cy="250" r="226" fill="none" stroke="url(#goldGradient)" stroke-width="2.5" stroke-dasharray="6,4" />

  <!-- Inner Seal Circle -->
  <circle cx="250" cy="250" r="150" fill="#0f172a" stroke="url(#goldGradient)" stroke-width="5" />

  <!-- Glory Sunburst Rays in Center -->
  <g opacity="0.25" stroke="url(#goldLight)" stroke-width="2">
    <line x1="250" y1="120" x2="250" y2="250" />
    <line x1="250" y1="250" x2="250" y2="380" />
    <line x1="120" y1="250" x2="250" y2="250" />
    <line x1="250" y1="250" x2="380" y2="250" />
    <line x1="158" y1="158" x2="250" y2="250" />
    <line x1="250" y1="250" x2="342" y2="342" />
    <line x1="158" y1="342" x2="250" y2="250" />
    <line x1="250" y1="250" x2="342" y2="158" />
  </g>

  <!-- Arched Text - LIVING FAITH -->
  <text fill="url(#goldLight)" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="bold" letter-spacing="7">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      LIVING FAITH
    </textPath>
  </text>

  <!-- Arched Text - INTERNATIONAL ASSEMBLIES -->
  <text fill="url(#goldLight)" font-family="Arial, sans-serif" font-size="16" font-weight="bold" letter-spacing="4">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      • INTERNATIONAL ASSEMBLIES •
    </textPath>
  </text>

  <!-- Star Emblems on Sides -->
  <polygon points="76,250 81,242 90,242 83,248 86,257 78,251 70,257 73,248 66,242 75,242" fill="url(#goldGradient)" />
  <polygon points="424,250 429,242 438,242 431,248 434,257 426,251 418,257 421,248 414,242 423,242" fill="url(#goldGradient)" />

  <!-- Shield of Faith -->
  <path d="M 200 175 L 300 175 C 300 240, 270 280, 250 300 C 230 280, 200 240, 200 175 Z" 
        fill="#1e293b" stroke="url(#goldGradient)" stroke-width="4" filter="url(#glow)" />

  <!-- The Cross of Christ -->
  <g fill="url(#goldGradient)" stroke="#78350f" stroke-width="1">
    <!-- Vertical Beam -->
    <rect x="242" y="190" width="16" height="85" rx="2" />
    <!-- Horizontal Beam -->
    <rect x="222" y="210" width="56" height="15" rx="2" />
  </g>

  <!-- Open Bible Pages at Base of Shield -->
  <path d="M 215 285 Q 250 275 250 295 Q 250 275 285 285 L 285 305 Q 250 295 250 312 Q 250 295 215 305 Z" 
        fill="#f8fafc" stroke="url(#goldGradient)" stroke-width="2.5" />
  <line x1="250" y1="282" x2="250" y2="312" stroke="#d97706" stroke-width="2" />

  <!-- Year Est. 2026 -->
  <text x="250" y="340" fill="url(#goldLight)" font-family="Arial, sans-serif" font-size="12" font-weight="bold" letter-spacing="3" text-anchor="middle">
    EST. 2026
  </text>
</svg>
